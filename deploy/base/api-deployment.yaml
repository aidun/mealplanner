apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: migrate
          image: ghcr.io/aidun/mealplanner/api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mealplanner-database
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/aidun/mealplanner/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: APP_ENV
              value: "development"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mealplanner-database
                  key: DATABASE_URL
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: API_SECRET
                  optional: true
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: CORS_ORIGINS
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: AUTH_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AUTH_BASE_URL
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SESSION_SECRET
                  optional: true
            - name: AUTH_ALLOWED_SUBJECT_HASHES
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AUTH_ALLOWED_SUBJECT_HASHES
                  optional: true
            - name: AUTH_ALLOWED_EMAIL_HASHES
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AUTH_ALLOWED_EMAIL_HASHES
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: APPLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: APPLE_CLIENT_ID
                  optional: true
            - name: APPLE_TEAM_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: APPLE_TEAM_ID
                  optional: true
            - name: APPLE_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: APPLE_KEY_ID
                  optional: true
            - name: APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: APPLE_PRIVATE_KEY
                  optional: true
            - name: PROVIDER_MODE
              value: "mock"
            - name: OPENAI_MEAL_MODEL
              value: "gpt-5.4-mini"
            - name: RATE_LIMIT_REQUESTS_PER_MINUTE
              value: "20"
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
