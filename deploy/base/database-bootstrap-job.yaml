apiVersion: batch/v1
kind: Job
metadata:
  name: database-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: database-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: database-bootstrap
      containers:
        - name: bootstrap
          image: bitnamilegacy/kubectl:1.33.4-debian-12-r0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /bootstrap/bootstrap.sh
          env:
            - name: POSTGRES_DB
              value: mealplanner
            - name: POSTGRES_USER
              value: mealplanner
            - name: API_SECRET_PLACEHOLDER
              value: __set_api_secret__
            - name: OPENAI_API_KEY_PLACEHOLDER
              value: __set_openai_api_key__
            - name: EMAIL_ENABLED_PLACEHOLDER
              value: "true"
            - name: EMAIL_PROVIDER_PLACEHOLDER
              value: resend
            - name: EMAIL_FROM_PLACEHOLDER
              value: info@markushartmann.dev
            - name: EMAIL_REPLY_TO_PLACEHOLDER
              value: info@markushartmann.dev
            - name: RESEND_API_KEY_PLACEHOLDER
              value: ""
            - name: AUTH_BASE_URL_PLACEHOLDER
              value: https://mealplanner.markushartmann.dev
            - name: SESSION_SECRET_PLACEHOLDER
              value: __set_random_session_secret_min_32_bytes__
            - name: AUTH_ALLOWED_SUBJECT_HASHES_PLACEHOLDER
              value: __set_allowed_subject_hashes__
            - name: AUTH_ALLOWED_EMAIL_HASHES_PLACEHOLDER
              value: ""
            - name: GOOGLE_CLIENT_ID_PLACEHOLDER
              value: __set_google_client_id__
            - name: GOOGLE_CLIENT_SECRET_PLACEHOLDER
              value: __set_google_client_secret__
            - name: APPLE_CLIENT_ID_PLACEHOLDER
              value: ""
            - name: APPLE_TEAM_ID_PLACEHOLDER
              value: ""
            - name: APPLE_KEY_ID_PLACEHOLDER
              value: ""
            - name: APPLE_PRIVATE_KEY_PLACEHOLDER
              value: ""
          volumeMounts:
            - name: bootstrap-script
              mountPath: /bootstrap
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bootstrap-script
          configMap:
            name: database-bootstrap-script
            defaultMode: 493
