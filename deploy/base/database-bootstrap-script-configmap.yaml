apiVersion: v1
kind: ConfigMap
metadata:
  name: database-bootstrap-script
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    label_secret() {
      name="$1"
      management="$2"
      exception="${3:-false}"

      if kubectl get secret "${name}" >/dev/null 2>&1; then
        kubectl label secret "${name}" \
          security.aidun.dev/management="${management}" \
          security.aidun.dev/owner="mealplanner" \
          security.aidun.dev/secret-exception="${exception}" \
          --overwrite >/dev/null
      fi
    }

    ensure_api_secret_key() {
      key="$1"
      value="$2"

      existing="$(kubectl get secret api-secrets -o "jsonpath={.data.${key}}" 2>/dev/null || true)"
      if [ -n "${existing}" ]; then
        decoded="$(printf '%s' "${existing}" | base64 -d 2>/dev/null || true)"
        case "${decoded}" in
          __set_*)
            case "${value}" in
              __set_*)
                echo "api-secrets key ${key} still has placeholder"
                return
                ;;
              *)
                echo "api-secrets key ${key} replaces placeholder"
                ;;
            esac
            ;;
          *)
            echo "api-secrets key ${key} already exists"
            return
            ;;
        esac
      fi

      encoded="$(printf '%s' "${value}" | base64 | tr -d '\n')"
      kubectl patch secret api-secrets --type merge -p "{\"data\":{\"${key}\":\"${encoded}\"}}"
    }

    if kubectl get secret mealplanner-database >/dev/null 2>&1; then
      echo "mealplanner-database already exists"
    else
      postgres_db="${POSTGRES_DB:-mealplanner}"
      postgres_user="${POSTGRES_USER:-mealplanner}"
      postgres_password="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
      database_url="postgres://${postgres_user}:${postgres_password}@postgres:5432/${postgres_db}?sslmode=disable"

      kubectl create secret generic mealplanner-database \
        --from-literal=POSTGRES_DB="${postgres_db}" \
        --from-literal=POSTGRES_USER="${postgres_user}" \
        --from-literal=POSTGRES_PASSWORD="${postgres_password}" \
        --from-literal=DATABASE_URL="${database_url}"
    fi
    label_secret mealplanner-database generated

    if kubectl get secret api-secrets >/dev/null 2>&1; then
      echo "api-secrets already exists"
    else
      api_secret="${API_SECRET_PLACEHOLDER:-__set_api_secret__}"
      openai_api_key="${OPENAI_API_KEY_PLACEHOLDER:-__set_openai_api_key__}"

      kubectl create secret generic api-secrets \
        --from-literal=API_SECRET="${api_secret}" \
        --from-literal=OPENAI_API_KEY="${openai_api_key}" \
        --from-literal=EMAIL_ENABLED="${EMAIL_ENABLED_PLACEHOLDER:-true}" \
        --from-literal=EMAIL_PROVIDER="${EMAIL_PROVIDER_PLACEHOLDER:-resend}" \
        --from-literal=EMAIL_FROM="${EMAIL_FROM_PLACEHOLDER:-info@markushartmann.dev}" \
        --from-literal=EMAIL_REPLY_TO="${EMAIL_REPLY_TO_PLACEHOLDER:-info@markushartmann.dev}" \
        --from-literal=RESEND_API_KEY="${RESEND_API_KEY_PLACEHOLDER:-}" \
        --from-literal=AUTH_BASE_URL="${AUTH_BASE_URL_PLACEHOLDER:-__set_https_auth_base_url__}" \
        --from-literal=SESSION_SECRET="${SESSION_SECRET_PLACEHOLDER:-__set_random_session_secret_min_32_bytes__}" \
        --from-literal=AUTH_ALLOWED_SUBJECT_HASHES="${AUTH_ALLOWED_SUBJECT_HASHES_PLACEHOLDER:-__set_allowed_subject_hashes__}" \
        --from-literal=AUTH_ALLOWED_EMAIL_HASHES="${AUTH_ALLOWED_EMAIL_HASHES_PLACEHOLDER:-}" \
        --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID_PLACEHOLDER:-__set_google_client_id__}" \
        --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET_PLACEHOLDER:-__set_google_client_secret__}" \
        --from-literal=APPLE_CLIENT_ID="${APPLE_CLIENT_ID_PLACEHOLDER:-}" \
        --from-literal=APPLE_TEAM_ID="${APPLE_TEAM_ID_PLACEHOLDER:-}" \
        --from-literal=APPLE_KEY_ID="${APPLE_KEY_ID_PLACEHOLDER:-}" \
        --from-literal=APPLE_PRIVATE_KEY="${APPLE_PRIVATE_KEY_PLACEHOLDER:-}"
    fi
    label_secret api-secrets live-only true

    ensure_api_secret_key AUTH_BASE_URL "${AUTH_BASE_URL_PLACEHOLDER:-__set_https_auth_base_url__}"
    ensure_api_secret_key API_SECRET "${API_SECRET_PLACEHOLDER:-__set_api_secret__}"
    ensure_api_secret_key OPENAI_API_KEY "${OPENAI_API_KEY_PLACEHOLDER:-__set_openai_api_key__}"
    ensure_api_secret_key EMAIL_ENABLED "${EMAIL_ENABLED_PLACEHOLDER:-true}"
    ensure_api_secret_key EMAIL_PROVIDER "${EMAIL_PROVIDER_PLACEHOLDER:-resend}"
    ensure_api_secret_key EMAIL_FROM "${EMAIL_FROM_PLACEHOLDER:-info@markushartmann.dev}"
    ensure_api_secret_key EMAIL_REPLY_TO "${EMAIL_REPLY_TO_PLACEHOLDER:-info@markushartmann.dev}"
    ensure_api_secret_key RESEND_API_KEY "${RESEND_API_KEY_PLACEHOLDER:-}"
    ensure_api_secret_key SESSION_SECRET "${SESSION_SECRET_PLACEHOLDER:-__set_random_session_secret_min_32_bytes__}"
    ensure_api_secret_key AUTH_ALLOWED_SUBJECT_HASHES "${AUTH_ALLOWED_SUBJECT_HASHES_PLACEHOLDER:-__set_allowed_subject_hashes__}"
    ensure_api_secret_key AUTH_ALLOWED_EMAIL_HASHES "${AUTH_ALLOWED_EMAIL_HASHES_PLACEHOLDER:-}"
    ensure_api_secret_key GOOGLE_CLIENT_ID "${GOOGLE_CLIENT_ID_PLACEHOLDER:-__set_google_client_id__}"
    ensure_api_secret_key GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET_PLACEHOLDER:-__set_google_client_secret__}"
    ensure_api_secret_key APPLE_CLIENT_ID "${APPLE_CLIENT_ID_PLACEHOLDER:-}"
    ensure_api_secret_key APPLE_TEAM_ID "${APPLE_TEAM_ID_PLACEHOLDER:-}"
    ensure_api_secret_key APPLE_KEY_ID "${APPLE_KEY_ID_PLACEHOLDER:-}"
    ensure_api_secret_key APPLE_PRIVATE_KEY "${APPLE_PRIVATE_KEY_PLACEHOLDER:-}"

    if kubectl get secret ghcr-pull-secret >/dev/null 2>&1; then
      echo "ghcr-pull-secret already exists"
    elif [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
      kubectl create secret docker-registry ghcr-pull-secret \
        --docker-server=ghcr.io \
        --docker-username="${GHCR_USERNAME}" \
        --docker-password="${GHCR_TOKEN}" \
        --docker-email="bootstrap@mealplanner.invalid"
    else
      echo "ghcr-pull-secret not created; set GHCR_USERNAME and GHCR_TOKEN to bootstrap it"
    fi
    label_secret ghcr-pull-secret live-only
    label_secret entrypoint-secrets live-only
    label_secret cloudflared-credentials live-only
