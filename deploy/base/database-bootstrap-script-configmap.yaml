apiVersion: v1
kind: ConfigMap
metadata:
  name: database-bootstrap-script
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    label_secret() {
      name="$1"
      management="$2"
      exception="${3:-false}"

      if kubectl get secret "${name}" >/dev/null 2>&1; then
        kubectl label secret "${name}" \
          security.aidun.dev/management="${management}" \
          security.aidun.dev/owner="mealplanner" \
          security.aidun.dev/secret-exception="${exception}" \
          --overwrite >/dev/null
      fi
    }

    secret_value() {
      name="$1"
      key="$2"
      raw="$(kubectl get secret "${name}" -o "jsonpath={.data.${key}}" 2>/dev/null || true)"
      if [ -z "${raw}" ]; then
        return 0
      fi
      printf '%s' "${raw}" | base64 -d 2>/dev/null || true
    }

    resolved_secret_value() {
      target_secret="$1"
      key="$2"
      fallback_value="$3"
      legacy_secret="${4:-}"

      current="$(secret_value "${target_secret}" "${key}")"
      case "${current}" in
        ""|__set_*) ;;
        *)
          printf '%s' "${current}"
          return 0
          ;;
      esac

      if [ -n "${legacy_secret}" ]; then
        legacy="$(secret_value "${legacy_secret}" "${key}")"
        case "${legacy}" in
          ""|__set_*) ;;
          *)
            printf '%s' "${legacy}"
            return 0
            ;;
        esac
      fi

      printf '%s' "${fallback_value}"
    }

    ensure_secret_key() {
      secret_name="$1"
      key="$2"
      value="$3"
      management="$4"
      exception="${5:-false}"

      if kubectl get secret "${secret_name}" >/dev/null 2>&1; then
        encoded="$(printf '%s' "${value}" | base64 | tr -d '\n')"
        kubectl patch secret "${secret_name}" --type merge -p "{\"data\":{\"${key}\":\"${encoded}\"}}" >/dev/null
      else
        kubectl create secret generic "${secret_name}" --from-literal="${key}=${value}" >/dev/null
      fi

      label_secret "${secret_name}" "${management}" "${exception}"
    }

    if kubectl get secret mealplanner-database >/dev/null 2>&1; then
      echo "mealplanner-database already exists"
    else
      postgres_db="${POSTGRES_DB:-mealplanner}"
      postgres_user="${POSTGRES_USER:-mealplanner}"
      postgres_password="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
      database_url="postgres://${postgres_user}:${postgres_password}@postgres:5432/${postgres_db}?sslmode=disable"

      kubectl create secret generic mealplanner-database \
        --from-literal=POSTGRES_DB="${postgres_db}" \
        --from-literal=POSTGRES_USER="${postgres_user}" \
        --from-literal=POSTGRES_PASSWORD="${postgres_password}" \
        --from-literal=DATABASE_URL="${database_url}"
    fi
    label_secret mealplanner-database generated

    ensure_secret_key mealplanner-api-internal API_SECRET \
      "$(resolved_secret_value mealplanner-api-internal API_SECRET "${API_SECRET_PLACEHOLDER:-__set_api_secret__}" api-secrets)" \
      live-only
    ensure_secret_key mealplanner-auth-core SESSION_SECRET \
      "$(resolved_secret_value mealplanner-auth-core SESSION_SECRET "${SESSION_SECRET_PLACEHOLDER:-__set_random_session_secret_min_32_bytes__}" api-secrets)" \
      live-only
    ensure_secret_key mealplanner-auth-core AUTH_ALLOWED_SUBJECT_HASHES \
      "$(resolved_secret_value mealplanner-auth-core AUTH_ALLOWED_SUBJECT_HASHES "${AUTH_ALLOWED_SUBJECT_HASHES_PLACEHOLDER:-__set_allowed_subject_hashes__}" api-secrets)" \
      live-only
    ensure_secret_key mealplanner-auth-core AUTH_ALLOWED_EMAIL_HASHES \
      "$(resolved_secret_value mealplanner-auth-core AUTH_ALLOWED_EMAIL_HASHES "${AUTH_ALLOWED_EMAIL_HASHES_PLACEHOLDER:-}" api-secrets)" \
      live-only

    ensure_secret_key mealplanner-openai OPENAI_API_KEY \
      "$(resolved_secret_value mealplanner-openai OPENAI_API_KEY "${OPENAI_API_KEY_PLACEHOLDER:-__set_openai_api_key__}" api-secrets)" \
      live-only
    ensure_secret_key mealplanner-oidc-google GOOGLE_CLIENT_SECRET \
      "$(resolved_secret_value mealplanner-oidc-google GOOGLE_CLIENT_SECRET "${GOOGLE_CLIENT_SECRET_PLACEHOLDER:-__set_google_client_secret__}" api-secrets)" \
      live-only
    ensure_secret_key mealplanner-oidc-apple APPLE_PRIVATE_KEY \
      "$(resolved_secret_value mealplanner-oidc-apple APPLE_PRIVATE_KEY "${APPLE_PRIVATE_KEY_PLACEHOLDER:-}" api-secrets)" \
      live-only

    ensure_secret_key mealplanner-email-provider RESEND_API_KEY \
      "$(resolved_secret_value mealplanner-email-provider RESEND_API_KEY "${RESEND_API_KEY_PLACEHOLDER:-}" api-secrets)" \
      live-only

    if kubectl get secret api-secrets >/dev/null 2>&1; then
      kubectl delete secret api-secrets >/dev/null
    fi

    if kubectl get secret ghcr-pull-secret >/dev/null 2>&1; then
      echo "ghcr-pull-secret already exists"
    elif [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
      kubectl create secret docker-registry ghcr-pull-secret \
        --docker-server=ghcr.io \
        --docker-username="${GHCR_USERNAME}" \
        --docker-password="${GHCR_TOKEN}" \
        --docker-email="bootstrap@mealplanner.invalid"
    else
      echo "ghcr-pull-secret not created; set GHCR_USERNAME and GHCR_TOKEN to bootstrap it"
    fi
    label_secret ghcr-pull-secret live-only
