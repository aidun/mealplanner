apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-plan
spec:
  schedule: "0 8 * * 0"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: weekly-plan
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.17.0
              imagePullPolicy: IfNotPresent
              env:
                - name: API_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: API_SECRET
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  curl -fsS \
                    -H "Content-Type: application/json" \
                    -H "X-API-Secret: ${API_SECRET}" \
                    -X POST \
                    --data '{}' \
                    http://api:3001/api/internal/plans/weekly
