---
apiVersion: v1
kind: Service
metadata:
  name: entrypoint
  annotations:
    metallb.io/address-pool: lan-pool
  labels:
    app.kubernetes.io/component: entrypoint
    app.kubernetes.io/part-of: mealplanner
    security.aidun.dev/owner: mealplanner
spec:
  type: LoadBalancer
  selector:
    app: entrypoint
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
