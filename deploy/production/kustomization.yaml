apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealplanner

resources:
  - ../base
  - entrypoint.yaml
  - api-pdb.yaml
  - frontend-pdb.yaml

images:
  - name: ghcr.io/aidun/mealplanner/api
    newName: ghcr.io/aidun/mealplanner/api
    newTag: stable # replaced by bot PR: stable-<git-sha>
  - name: ghcr.io/aidun/mealplanner/frontend
    newName: ghcr.io/aidun/mealplanner/frontend
    newTag: stable # replaced by bot PR: stable-<git-sha>

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "production"
      - op: replace
        path: /spec/template/spec/containers/0/env/16/value
        value: "live"
      - op: replace
        path: /spec/template/spec/containers/0/env/18/value
        value: "40"
    target:
      kind: Deployment
      name: api
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
    target:
      kind: PersistentVolumeClaim
      name: postgres-data
