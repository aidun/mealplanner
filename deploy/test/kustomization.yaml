apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealplanner-test

resources:
  - ../base
  - entrypoint.yaml

images:
  - name: ghcr.io/aidun/mealplanner/api
    newName: ghcr.io/aidun/mealplanner/api
    newTag: master-e7c41b7-amd64 # replaced by local pipeline: master-<git-sha>
  - name: ghcr.io/aidun/mealplanner/frontend
    newName: ghcr.io/aidun/mealplanner/frontend
    newTag: master-e7c41b7-amd64 # replaced by local pipeline: master-<git-sha>

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: mealplanner-test
    target:
      kind: Namespace
      name: mealplanner-test
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: APP_ENV
                    value: "test"
                  - name: PROVIDER_MODE
                    value: "live"
                  - name: PROMPT_DEBUG
                    value: "true"
    target:
      kind: Deployment
      name: api
