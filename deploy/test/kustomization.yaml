apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealplanner-test

resources:
  - ../base
  - entrypoint.yaml

images:
  - name: ghcr.io/aidun/mealplanner/api
    newName: ghcr.io/aidun/mealplanner/api
    newTag: master-a8d45de # replaced by local pipeline: master-<git-sha>
  - name: ghcr.io/aidun/mealplanner/frontend
    newName: ghcr.io/aidun/mealplanner/frontend
    newTag: master-a8d45de # replaced by local pipeline: master-<git-sha>

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: mealplanner-test
    target:
      kind: Namespace
      name: mealplanner-test
  - patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/2/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/2/value
        value: ""
    target:
      kind: Deployment
      name: api
