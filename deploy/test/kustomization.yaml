apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mealplanner-test

resources:
  - ../base
  - entrypoint.yaml

images:
  - name: ghcr.io/aidun/mealplanner/api
    newName: ghcr.io/aidun/mealplanner/api
    newTag: master-666bd9f-amd64 # replaced by local pipeline: master-<git-sha>
  - name: ghcr.io/aidun/mealplanner/frontend
    newName: ghcr.io/aidun/mealplanner/frontend
    newTag: master-666bd9f-amd64 # replaced by local pipeline: master-<git-sha>

patches:
  - patch: |-
      - op: replace
        path: /metadata/name
        value: mealplanner-test
    target:
      kind: Namespace
      name: mealplanner-test
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "test"
      - op: replace
        path: /spec/template/spec/containers/0/env/16/value
        value: "live"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROMPT_DEBUG
          value: "true"
    target:
      kind: Deployment
      name: api
