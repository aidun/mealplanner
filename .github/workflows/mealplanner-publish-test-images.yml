name: Mealplanner - Publish Test Images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to publish for the test environment
        required: true
        default: master
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: mealplanner-publish-test-images
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mealplanner:mealplanner@127.0.0.1:5432/mealplanner_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mealplanner
          POSTGRES_PASSWORD: mealplanner
          POSTGRES_DB: mealplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mealplanner -d mealplanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
          cache-dependency-path: backend/api/go.sum
      - name: Verify backend
        working-directory: backend/api
        run: |
          go vet ./...
          go test ./...

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test -- --run
          npm run build
          npm run test:e2e

  verify-manifests:
    name: Verify manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0
      - run: kubectl kustomize deploy/base > /tmp/deploy-base.yaml

  publish-test-images:
    name: Build and publish test images
    needs: [verify-backend, verify-frontend, verify-manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
      - id: meta
        shell: bash
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          source_ref="${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "branch_short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: aidun
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend/api
          file: backend/api/Dockerfile
          push: true
          tags: |
            ghcr.io/aidun/mealplanner/api:master
            ghcr.io/aidun/mealplanner/api:master-${{ steps.meta.outputs.short_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_PROMPT_DEBUG=true
          tags: |
            ghcr.io/aidun/mealplanner/frontend:master
            ghcr.io/aidun/mealplanner/frontend:master-${{ steps.meta.outputs.short_sha }}

